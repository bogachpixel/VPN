<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — TouchVPN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-logo">
      <div class="logo-icon">🛡</div>
      <span class="logo-text">TouchVPN</span>
    </a>
    <div class="navbar-links">
      <a href="/register" class="btn btn-outline">Регистрация</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-box">
      <div class="card">
        <h1 class="auth-title">Добро пожаловать</h1>
        <p class="auth-subtitle">Войдите в свой аккаунт</p>

        <div id="alert" class="alert"></div>

        <form id="loginForm">
          <div class="form-toggle">
            <button type="button" data-type="phone" class="active">📱 Телефон</button>
            <button type="button" data-type="email">✉️ Email</button>
          </div>

          <div class="form-group phone-group">
            <label class="form-label" for="phone">Номер телефона</label>
            <div class="phone-field-wrap">
              <button type="button" class="country-btn">
                <span class="c-flag">🇷🇺</span>
                <span class="c-dial">+7</span>
                <span class="c-chev">▾</span>
              </button>
              <div class="country-dropdown" style="display:none;"></div>
              <input class="form-input phone-local" type="tel" id="phone" placeholder="(___) ___-__-__" />
            </div>
          </div>

          <div class="form-group email-group" style="display:none;">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-input" type="password" id="password" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">Войти</button>
        </form>

        <hr class="divider" />
        <p style="text-align:center; font-size:0.9rem; color: var(--text-secondary);">
          Нет аккаунта? <a href="/register">Зарегистрируйтесь</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/security-check.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
