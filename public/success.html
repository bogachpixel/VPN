<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Оплата прошла — TouchVPN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="success-container">
    <div style="max-width: 480px; width: 100%;">
      <div class="card" style="text-align:center; padding: 40px 32px;">
        <div id="statusIcon" style="font-size:3rem; margin-bottom:16px;">⏳</div>
        <h2 id="statusTitle" style="font-size:1.5rem; margin-bottom:12px;">Активируем подписку…</h2>
        <p id="statusText" style="color:var(--text-secondary); margin-bottom:28px;">
          Подождите, ваш VPN активируется автоматически
        </p>
        <div id="spinner" style="margin-bottom:20px;">
          <div style="width:36px;height:36px;border:3px solid rgba(0,212,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto;"></div>
        </div>
        <a id="dashBtn" href="/dashboard" class="btn btn-primary btn-lg btn-full" style="display:none;">
          Открыть личный кабинет →
        </a>
      </div>
    </div>
  </div>
  <style>
    .success-container { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script src="/js/api.js"></script>
  <script>
    let attempts = 0;
    const MAX = 20;

    async function checkActivation() {
      attempts++;
      try {
        const data = await apiRequest('GET', '/subscription/active');
        if (data.hasSubscription && !data.subscription.isExpired) {
          document.getElementById('statusIcon').textContent  = '✅';
          document.getElementById('statusTitle').textContent = 'Подписка активирована!';
          document.getElementById('statusText').textContent  = 'Ваш VPN готов к использованию.';
          document.getElementById('spinner').style.display   = 'none';
          document.getElementById('dashBtn').style.display   = '';
          return;
        }
      } catch (e) {}

      if (attempts >= MAX) {
        document.getElementById('statusIcon').textContent  = '⚠️';
        document.getElementById('statusTitle').textContent = 'Ожидаем подтверждения';
        document.getElementById('statusText').textContent  = 'Активация займёт чуть больше времени — загляните в кабинет через минуту.';
        document.getElementById('spinner').style.display   = 'none';
        document.getElementById('dashBtn').style.display   = '';
        return;
      }

      setTimeout(checkActivation, 3000);
    }

    if (localStorage.getItem('vpn_token')) {
      checkActivation();
    } else {
      document.getElementById('statusIcon').textContent  = '✅';
      document.getElementById('statusTitle').textContent = 'Оплата прошла успешно!';
      document.getElementById('statusText').textContent  = 'Войдите в аккаунт, чтобы получить доступ к VPN.';
      document.getElementById('spinner').style.display   = 'none';
      document.getElementById('dashBtn').style.display   = '';
      document.getElementById('dashBtn').href = '/login';
      document.getElementById('dashBtn').textContent = 'Войти в аккаунт →';
    }
  </script>
</body>
</html>
