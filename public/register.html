<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — TouchVPN</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-logo">
      <div class="logo-icon">🛡</div>
      <span class="logo-text">TouchVPN</span>
    </a>
    <div class="navbar-links">
      <a href="/login" class="btn btn-outline">Войти</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="auth-box">
      <div class="card">
        <h1 class="auth-title">Создайте аккаунт</h1>
        <p class="auth-subtitle">Регистрация занимает 30 секунд</p>

        <div id="alert" class="alert"></div>

        <form id="registerForm">
          <div class="form-toggle">
            <button type="button" data-type="phone" class="active">📱 Телефон</button>
            <button type="button" data-type="email">✉️ Email</button>
          </div>

          <div class="form-group phone-group">
            <label class="form-label" for="phone">Номер телефона</label>
            <input class="form-input" type="tel" id="phone" placeholder="+7 (___) ___-__-__" />
          </div>

          <div class="form-group email-group" style="display:none;">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="vpnName">Имя вашего VPN-соединения</label>
            <input class="form-input" type="text" id="vpnName" placeholder="Например: Мой VPN, Work или Home" maxlength="50" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Пароль</label>
            <input class="form-input" type="password" id="password" placeholder="Минимум 6 символов" required minlength="6" />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm">Повторите пароль</label>
            <input class="form-input" type="password" id="confirm" placeholder="••••••••" required />
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg">Зарегистрироваться</button>
        </form>

        <hr class="divider" />
        <p style="text-align:center; font-size:0.9rem; color: var(--text-secondary);">
          Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/security-check.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
